# ============================
# AI Workstation Kitty
# ============================

include tokyo-night.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.5

disable_ligatures never

background_opacity 0.92
background_blur 48

window_padding_width 16

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.45

scrollback_lines 50000

enable_audio_bell no
visual_bell_duration 0

confirm_os_window_close 0

shell_integration enabled

copy_on_select yes

remember_window_size yes

hide_window_decorations yes

resize_draw_strategy scale

# ----------------------------
# Tabs
# ----------------------------

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

active_tab_font_style bold
inactive_tab_font_style normal

active_tab_background   #ffffff
active_tab_foreground   #111111

inactive_tab_background #22252e
inactive_tab_foreground #8b949e

tab_separator " "

# ----------------------------
# Window
# ----------------------------

active_border_color #ffffff
inactive_border_color #3b4252

draw_minimal_borders yes

# ----------------------------
# Selection
# ----------------------------

selection_background #7aa2f7
selection_foreground #111111

# ----------------------------
# URL
# ----------------------------

url_color #89b4fa
underline_hyperlinks always
