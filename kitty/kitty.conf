# ============================
# AI Workstation Kitty
# ============================

include tokyo-night.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.5

disable_ligatures never

background_opacity 0.52
background_blur 10

window_padding_width 16

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.45

scrollback_lines 50000

enable_audio_bell no
visual_bell_duration 0

confirm_os_window_close 0

shell_integration enabled

copy_on_select yes

remember_window_size yes

hide_window_decorations yes

resize_draw_strategy scale

# ----------------------------
# Tabs
# ----------------------------

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

active_tab_font_style bold
inactive_tab_font_style normal

active_tab_background   #ffffff
active_tab_foreground   #111111

inactive_tab_background #22252e
inactive_tab_foreground #8b949e

tab_separator " "

# ----------------------------
# Window
# ----------------------------

active_border_color #ffffff
inactive_border_color #3b4252

draw_minimal_borders yes

# ----------------------------
# Selection
# ----------------------------

selection_background #7aa2f7
selection_foreground #111111

# ----------------------------
# URL
# ----------------------------

url_color #89b4fa
underline_hyperlinks always

# ============================
# Black / Minimal Palette
# ============================

background              #080909
foreground              #d6d8d3

cursor                  #e5e7df
cursor_text_color       #080909

selection_background    #303330
selection_foreground    #f2f3ee

url_color               #a8b89a

# ANSI
color0  #0d0f0e
color1  #c96b6b
color2  #8fa77a
color3  #c2aa72
color4  #7f96ad
color5  #9c8fa8
color6  #7fa69b
color7  #d6d8d3

color8  #454945
color9  #dd8585
color10 #a9c48f
color11 #d5c08a
color12 #9bafc3
color13 #b5a5bd
color14 #91b9aa
color15 #f0f1ec

# ============================
# Tabs
# ============================

active_tab_background     #d6d8d3
active_tab_foreground     #080909

inactive_tab_background   #111312
inactive_tab_foreground   #70756f

# ============================
# Borders
# ============================

active_border_color       #454945
inactive_border_color     #181b19
