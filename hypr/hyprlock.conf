background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(c0caf5ff)

    font_size = 90
    font_family = JetBrainsMono Nerd Font

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"

    color = rgba(a9b1d6ff)

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 300, 55

    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2

    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26cc)
    font_color = rgba(c0caf5ff)

    fade_on_empty = false

    placeholder_text = Password

    position = 0, -80
    halign = center
    valign = center
}
