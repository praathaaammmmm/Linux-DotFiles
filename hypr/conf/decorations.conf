general {
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(313244aa)

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 0.95
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
    }
}

