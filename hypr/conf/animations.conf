animations {
    enabled = yes

    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = easeInOut, 0.65, 0, 0.35, 1

    animation = windows, 1, 6, easeOut, slide
    animation = windowsOut, 1, 5, easeInOut, slide
    animation = windowsMove, 1, 6, easeOut, slide

    animation = fade, 1, 6, easeOut
    animation = border, 1, 8, easeInOut
    animation = workspaces, 1, 7, easeOut, slide
}
